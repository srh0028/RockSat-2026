[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
lib_deps = 
    adafruit/Adafruit MAX31865 library @ ^1.1.0
; upload_port = D:

